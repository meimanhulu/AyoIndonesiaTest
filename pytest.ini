[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -r N

# -r N  → tampilkan ringkasan semua test (passed, failed, error) di akhir run
# --tb=short → tampilkan traceback ringkas, cukup untuk identifikasi bug

markers =
    price_validation: Validasi harga booking
    double_booking: Deteksi double booking
    schedule_integrity: Integritas data jadwal
    edge_case: Edge cases
